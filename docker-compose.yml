version: '3.8'

services:
  afiliados-agent:
    container_name: afiliados-agent
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
    networks:
      - afiliados-net

networks:
  afiliados-net:
    driver: bridge
